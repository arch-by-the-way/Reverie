name: Extension CI

on:
  push:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate manifest (web-ext, informational)
        run: npx web-ext lint --source-dir=. || echo "::warning::web-ext lint found issues (expected — MV3 service_worker not fully supported by Firefox's validator). Non-blocking for Chrome-first MVP."
        continue-on-error: true

      - name: Build
        run: npm run build